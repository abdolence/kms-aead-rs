# Every feature at once, so that every crate any feature set can pull in is checked. The TLS
# alternatives the crate refuses to combine are resolved together here, which `cargo deny`
# allows since it builds nothing.
[graph]
all-features = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Two versions of one crypto crate in a build mean two copies of the code to audit and patch, and
# a fix that reaches only one of them.
[bans]
multiple-versions = "allow"
deny = [
    { crate = "aes", deny-multiple-versions = true },
    { crate = "aes-gcm", deny-multiple-versions = true },
    { crate = "ring", deny-multiple-versions = true },
    { crate = "aws-lc-rs", deny-multiple-versions = true },
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    # The Mozilla root certificates in webpki-roots and webpki-root-certs.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # The OpenSSL-derived code in the AWS-LC FIPS module, aws-lc-fips-sys.
    "OpenSSL",
    "Unicode-3.0",
    # foldhash, the default hasher of the hashbrown that sqlx-core builds.
    "Zlib",
]

[advisories]
ignore = [
    # The rsa crate's private-key operations are not constant time, which reaches only the local
    # KMS's RSA private half on the RustCrypto backend; the book's security limits state it.
    # Remove once a fixed release exists.
    { id = "RUSTSEC-2023-0071", reason = "Marvin timing side channel on rsa private-key operations; used by the local KMS's asymmetric private half on the RustCrypto backend only, stated in the book's security limits; remove once fixed upstream" },
    # crypto-bigint 0.5.5 is p256 0.13's, which aws-config's `credentials-login` signs the token
    # requests of an `aws login` session with.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 via aws-config's credentials-login (aws-sdk-signin, p256 0.13): reached only when signing an aws login session's token requests on the machine that holds the session; remove once aws-config moves to p256 0.14" },
]
