[package]
name = "kms-aead-keyring"
version = "0.30.0"
authors = ["Abdulla Abdurakhmanov <me@abdolence.dev>"]
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "Versioned data encryption keys for kms-aead: keyrings in Firestore, PostgreSQL, S3 or GCS, with staged rotation, a compromised flag and BigQuery and Tink keyset export"
homepage = "https://kms-aead-rust.abdolence.dev"
repository = "https://github.com/abdolence/kms-aead-rs"
documentation = "https://docs.rs/kms-aead-keyring"
readme = "README.md"
categories = ["cryptography"]
keywords = ["kms", "keyring", "tink", "encryption", "aead"]
include = ["Cargo.toml", "src/**/*.rs", "README.md", "LICENSE"]

[lib]
name = "kms_aead_keyring"
path = "src/lib.rs"

[dependencies]
kms-aead = { version = "0.29", path = "..", default-features = false }
# The major version secret-vault-value depends on, so that one copy is in the tree.
base64 = "0.23"
# `Stream` and the bounded concurrency of a sweep.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
jiff = { version = "0.2", features = ["serde"] }
rsb_derive = { workspace = true }
secret-vault-value = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
# `rt` runs the task that follows a store's change signals, `time` spaces its revalidations, and
# `macros` lets it stop on a shutdown while it waits.
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
tracing = { workspace = true }
firestore = { version = "0.58", optional = true }
tokio-postgres = { version = "0.7", optional = true, default-features = false, features = ["runtime"] }
gcloud-sdk = { workspace = true, optional = true }
# The one-message request stream of a GCS `WriteObject`; tonic already depends on it.
tokio-stream = { version = "0.1", optional = true, default-features = false }
# The features kms-aead's aws-sdk-kms has, so that both share one HTTPS client and runtime.
aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
serde_bytes = { workspace = true, optional = true }
# The buffer `ToSql::to_sql` writes into, which tokio-postgres does not re-export.
bytes = { workspace = true, optional = true }
sqlx-core = { workspace = true, optional = true }
sqlx-postgres = { workspace = true, optional = true }

[dev-dependencies]
# The test provider implements kms-aead's provider trait, which is an `async_trait`.
async-trait = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
uuid = { version = "1", features = ["v7"] }
# The S3 client of the S3 store's examples.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
# The TLS connector of the PostgreSQL store's examples, with the platform's root certificates.
# tokio-postgres-rustls builds only on tokio-postgres's `runtime`, which a build without the
# `postgres` feature does not turn on.
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = "0.13"
# No crypto provider of its own: a second one beside the aws-lc-rs of gcloud-sdk or aws-sdk-s3
# leaves rustls without a process default, and their clients panic.
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-native-certs = "0.8"
# The pool of the `sqlx` feature's live test.
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }

[features]
default = []
# The AEAD backends of kms-aead: any number of them in one build.
ring = ["kms-aead/ring"]
aws-lc = ["kms-aead/aws-lc"]
aws-lc-fips = ["kms-aead/aws-lc-fips"]
rustcrypto = ["kms-aead/rustcrypto"]
# Deterministic key versions and every call on them. The deterministic types exist in every
# build.
deterministic = ["kms-aead/deterministic"]
# `KeyringAdmin` and the registry's `create`, `open_or_create` and `admin`: the calls that encrypt
# DEKs, write the record or export keysets, for the job or service that administers keyrings. An
# application that only encrypts, decrypts and sweeps builds without it.
admin = []
# `Serialize` and `Deserialize` for `Encrypted` and `SealMarker`, as bytes.
serde = ["kms-aead/serde", "dep:serde_bytes"]
# `Json<T>`, a plaintext stored as its JSON.
serde-json = ["serde", "kms-aead/serde-json"]
# `FirestoreKeyringStore`, on firestore-rs with its default TLS roots and crypto provider.
firestore = ["dep:firestore"]
# `PostgresKeyringStore` on tokio-postgres, and `ToSql` and `FromSql` for `Encrypted` and
# `SealMarker` as `BYTEA`.
postgres = ["dep:tokio-postgres", "kms-aead/postgres", "dep:bytes"]
# sqlx's `Type`, `Encode` and `Decode` for `Encrypted` and `SealMarker` on Postgres, as `BYTEA`.
sqlx = ["kms-aead/sqlx", "dep:sqlx-core", "dep:sqlx-postgres"]
# `GcsKeyringStore`, without a TLS root store or crypto provider: it needs a gcloud-sdk root store
# feature from the application, or one of the two below, to build.
gcs = ["dep:gcloud-sdk", "gcloud-sdk/google-storage-v2", "dep:tokio-stream"]
gcs-tls-roots = ["gcs", "gcloud-sdk/tls-roots", "gcloud-sdk/auth-default-crypto"]
gcs-tls-webpki = ["gcs", "gcloud-sdk/tls-webpki-roots", "gcloud-sdk/auth-default-crypto"]
# `S3KeyringStore`, on aws-sdk-s3 with the SDK's default HTTPS client.
s3 = ["dep:aws-sdk-s3"]
# `KeyringAdmin::export_bigquery_keyset`, an administrative call, on kms-aead's GCP provider without
# a TLS root store or crypto provider: the application enables kms-aead's `gcp-kms-encryption` to
# build it.
bigquery-export = ["admin", "kms-aead/gcp-kms-encryption-base"]
# The live test of the keyset export: BigQuery's `jobs.query`, and a root store and crypto provider
# for its Cloud KMS and BigQuery clients.
ci-bigquery = [
    "bigquery-export",
    "dep:gcloud-sdk",
    "gcloud-sdk/google-cloud-bigquery-v2",
    "kms-aead/gcp-kms-encryption",
]
# The live check of the Tink keyset export: kms-aead's Cloud KMS and AWS KMS providers, with a
# root store and crypto provider, for the `tink_export` example.
ci-tink = ["admin", "kms-aead/gcp-kms-encryption", "kms-aead/aws-kms-encryption"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = false
features = [
    "ring",
    "admin",
    "deterministic",
    "serde-json",
    "firestore",
    "postgres",
    "sqlx",
    "gcs-tls-roots",
    "s3",
    "bigquery-export",
]

[[example]]
name = "local_kms"
path = "examples/local_kms.rs"
required-features = ["ring", "admin"]

[[example]]
name = "migrate"
path = "examples/migrate.rs"
required-features = ["ring", "admin", "serde"]

[[example]]
name = "tink_export"
path = "examples/tink_export.rs"
required-features = ["ci-tink", "aws-lc"]

[[test]]
name = "bigquery_live"
path = "tests/bigquery_live.rs"
required-features = ["ci-bigquery", "deterministic", "ring"]
