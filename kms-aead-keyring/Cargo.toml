[package]
name = "kms-aead-keyring"
version = "0.30.0"
authors = ["Abdulla Abdurakhmanov <me@abdolence.dev>"]
edition = "2021"
license = "Apache-2.0"
description = "Field encryption over kms-aead with a keyring: key versions in a keyring store, Tink's value layout, rotation and a compromised flag"
homepage = "https://github.com/abdolence/kms-aead-rs"
repository = "https://github.com/abdolence/kms-aead-rs"
documentation = "https://docs.rs/kms-aead-keyring"
readme = "README.md"
categories = ["cryptography"]
keywords = ["kms", "keyring", "tink", "encryption", "aead"]
include = ["Cargo.toml", "src/**/*.rs", "README.md", "LICENSE"]

[lib]
name = "kms_aead_keyring"
path = "src/lib.rs"

[dependencies]
kms-aead = { version = "0.29", path = "..", default-features = false }
# The major version secret-vault-value depends on, so that one copy is in the tree.
base64 = "0.23"
# `Stream` and the bounded concurrency of a sweep.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
jiff = { version = "0.2", features = ["serde"] }
rsb_derive = { workspace = true }
secret-vault-value = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
# `rt` runs the task that follows a store's change signals and `time` spaces its revalidations.
tokio = { workspace = true, features = ["sync", "rt", "time"] }
tracing = { workspace = true }
firestore = { version = "0.58", optional = true }
# Never below 0.8.1: earlier releases overflow the length prefix of a large value in the wire
# protocol.
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"], optional = true }
gcloud-sdk = { workspace = true, optional = true }
# The one-message request stream of a GCS `WriteObject`; tonic already depends on it.
tokio-stream = { version = "0.1", optional = true, default-features = false }

[dev-dependencies]
# The test provider implements kms-aead's provider trait, which is an `async_trait`.
async-trait = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
uuid = { version = "1", features = ["v7"] }

[features]
default = []
# The AEAD backends of kms-aead: any number of them in one build.
ring = ["kms-aead/ring"]
aws-lc = ["kms-aead/aws-lc"]
aws-lc-fips = ["kms-aead/aws-lc-fips"]
rustcrypto = ["kms-aead/rustcrypto"]
# Creates deterministic key versions. The deterministic types exist in every build.
deterministic = ["kms-aead/deterministic"]
# Deprecated in kms-aead: reads the layouts written up to kms-aead 0.28.1.
legacy-formats = ["kms-aead/legacy-formats"]
# `Serialize` and `Deserialize` for `Encrypted`.
serde = ["kms-aead/serde"]
# `Json<T>`, a plaintext stored as its JSON.
serde-json = ["serde"]
# `FirestoreKeyringStore`, on firestore-rs with its default TLS roots and crypto provider.
firestore = ["dep:firestore"]
# `PostgresKeyringStore`, and `Type`, `Encode` and `Decode` for `Encrypted` as `BYTEA`. The
# store's listener task waits on its notifications and on the watch with `tokio::select!`.
postgres = ["dep:sqlx", "tokio/macros"]
# sqlx's TLS stacks for the store's connections, one of which a TLS connection needs.
postgres-tls-rustls = ["postgres", "sqlx/tls-rustls-aws-lc-rs"]
postgres-tls-rustls-ring = ["postgres", "sqlx/tls-rustls-ring"]
postgres-tls-native = ["postgres", "sqlx/tls-native-tls"]
# `GcsKeyringStore`, without a TLS root store or crypto provider: it needs a gcloud-sdk root store
# feature from the application, or one of the two below, to build.
gcs = ["dep:gcloud-sdk", "gcloud-sdk/google-storage-v2", "dep:tokio-stream"]
gcs-tls-roots = ["gcs", "gcloud-sdk/tls-roots", "gcloud-sdk/auth-default-crypto"]
gcs-tls-webpki = ["gcs", "gcloud-sdk/tls-webpki-roots", "gcloud-sdk/auth-default-crypto"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = false
features = [
    "ring",
    "deterministic",
    "serde-json",
    "firestore",
    "postgres-tls-rustls",
    "gcs-tls-roots",
]

[[example]]
name = "local_kms"
path = "examples/local_kms.rs"
required-features = ["ring"]

[[example]]
name = "migrate"
path = "examples/migrate.rs"
required-features = ["ring"]
