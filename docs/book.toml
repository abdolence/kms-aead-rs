[book]
authors = ["Abdulla Abdurakhmanov"]
language = "en"
src = "src"
title = "KMS envelope encryption for Rust"
description = "Envelope encryption for Rust with GCP KMS, AWS KMS, Azure Key Vault, HashiCorp Vault Transit or a local KMS, on ring, aws-lc-rs or RustCrypto"

[rust]
edition = "2021"

[build]
build-dir = "output"
create-missing = false

[output.html]
default-theme = "navy"
git-repository-url = "https://github.com/abdolence/kms-aead-rs"
cname = "kms-aead-rust.abdolence.dev"

[output.html.playground]
runnable = false

[output.html.redirect]
"/use-cases/choosing.html" = "/production/choosing.html"
"/use-cases/local-development.html" = "/production/local-development.html"
"/use-cases/deployment.html" = "/production/deployment.html"
"/use-cases/rotation.html" = "/production/rotation.html"
"/use-cases/incidents.html" = "/production/incidents.html"
"/use-cases/incidents.html#crypto-shredding" = "/use-cases/erase-a-tenant.html#crypto-shredding"
"/use-cases/incidents.html#shredding-a-tenant-with-dangerously_shred" = "/use-cases/erase-a-tenant.html#shredding-a-tenant-with-dangerously_shred"
"/use-cases/signed-records.html" = "/production/signed-records.html"
"/use-cases/envelope-to-keyring.html" = "/production/envelope-to-keyring.html"
