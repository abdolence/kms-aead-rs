<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <meta http-equiv="refresh" content="0; URL=/production/rotation.html">
    <link rel="canonical" href="/production/rotation.html">
  </head>
  <body>
      <p>Redirecting to... <a href="/production/rotation.html">/production/rotation.html</a>.</p>

<script>
    // This handles redirects that involve fragments.
    document.addEventListener('DOMContentLoaded', function() {
        const fragmentMap =
            {"#emergency-runbook":"/production/runbook.html","#migrating-from-envelope-values":"/production/envelope-to-keyring.html","#rotating-the-kek":"/production/rotation.html#re-encrypting-a-keyrings-deks","#rotation-cadence":"/production/rotation.html#rotation-cadence","#sweeps":"/production/sweeps.html"}
        ;
        const fragment = window.location.hash;
        if (fragment) {
            let redirectUrl = "/production/rotation.html";
            const target = fragmentMap[fragment];
            if (target) {
                let url = new URL(target, window.location.href);
                redirectUrl = url.href;
            } else {
                let url = new URL(redirectUrl, window.location.href);
                url.hash = window.location.hash;
                redirectUrl = url.href;
            }
            window.location.replace(redirectUrl);
        }
        // else redirect handled by http-equiv
    });
</script>
  </body>
</html>
