name: tests & formatting
on:
  push:
  pull_request:
    types: [opened]
  # A new advisory against dependencies that did not change is caught by the weekly run, which runs
  # the cargo deny job only.
  schedule:
    - cron: '5 4 * * 6'
jobs:
  # The provider rows: two Vault Transit rows that between them build each TLS root store and each
  # crypto provider, the two choices being independent, and one row per TLS stack the Azure
  # provider builds with. gcloud-sdk's TLS features select reqwest's TLS stack
  # too: `gcp-kms-encryption` turns on native-tls and `gcloud-sdk/tls-webpki-roots` turns on
  # rustls with aws-lc-rs, so each Azure row picks the GCP features that leave the Azure choice in
  # effect. The provider builds already compile aws-lc-rs for TLS, so they run on the aws-lc
  # backend and must not pull in ring; the ring Vault row is the exception its name states, and
  # the Azure no-provider row runs on rustcrypto, so that a provider build without ring or aws-lc
  # as its AEAD backend is covered. aws-sdk-kms still brings aws-lc-rs into that row.
  #
  # The backend rows build ring and rustcrypto alone, and aws-lc alone in the FIPS row, so that
  # one backend never hides a missing feature gate in another. The rustcrypto and FIPS rows build
  # `stream` as well, so that its code compiles and passes on a backend that is not ring.
  # deterministic builds beside ring, never only beside the RustCrypto AEAD crates, so it cannot
  # lean on their dependencies. The all-backends row runs the cross-backend contract tests and the
  # legacy-format readers. `absent` lists the crates a row's normal dependency tree must not
  # contain.
  build:
    name: ${{ matrix.name }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcp, aws on aws-lc
            features: gcp-kms-encryption,aws-kms-encryption,aws-lc
            absent: ring
          - name: vault roots, aws-lc-rs TLS on aws-lc, opentelemetry
            features: gcp-kms-encryption,aws-kms-encryption,aws-lc,hashicorp-vault-transit-kms-encryption-tls-roots,hashicorp-vault-transit-kms-encryption-tls-aws-lc-rs,opentelemetry
            absent: ring opentelemetry_sdk
          - name: vault webpki, ring TLS on ring, legacy formats
            features: gcp-kms-encryption,aws-kms-encryption,ring,hashicorp-vault-transit-kms-encryption-tls-webpki,hashicorp-vault-transit-kms-encryption-tls-ring,legacy-formats
          - name: azure native-tls on aws-lc, opentelemetry
            features: gcp-kms-encryption,aws-kms-encryption,aws-lc,azure-kms-encryption-native-tls,opentelemetry
            absent: ring opentelemetry_sdk
          - name: azure rustls aws-lc-rs on aws-lc
            features: gcp-kms-encryption-base,gcloud-sdk/tls-webpki-roots,aws-kms-encryption,aws-lc,azure-kms-encryption-tls-aws-lc-rs
            absent: ring
          - name: azure rustls no-provider on rustcrypto
            features: aws-kms-encryption,rustcrypto,azure-kms-encryption-tls-no-provider
            absent: ring
          - name: backend ring, deterministic
            features: ring,deterministic
            absent: aws-lc-rs
          - name: backend rustcrypto, stream
            features: rustcrypto,stream
            absent: ring aws-lc-rs
          - name: all backends, legacy formats
            features: ring,aws-lc,rustcrypto,deterministic,legacy-formats,stream
          - name: 'fields: postgres, sqlx on ring'
            features: ring,postgres,sqlx
            absent: rustls native-tls
          - name: backend aws-lc FIPS, stream
            features: aws-lc-fips,stream
            absent: ring aws-lc-sys
            fips: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The FIPS module builds from source with CMake and Go.
      - if: matrix.fips
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Run checks
        env:
          FEATURES: ${{ matrix.features }}
          ABSENT: ${{ matrix.absent }}
        run: |
          cargo fmt --all -- --check
          if cargo tree -e normal --features "$FEATURES" -d --depth 0 | grep -q '^reqwest '; then
            echo "Two reqwest versions: the Azure TLS features would configure the one azure_core does not use"
            exit 1
          fi
          for crate in $ABSENT; do
            if cargo tree -e normal --features "$FEATURES" --prefix none -f '{p}' | grep -q "^$crate v"; then
              echo "$crate is in the dependency tree of $FEATURES"
              exit 1
            fi
          done
          cargo clippy --all-targets --features "$FEATURES" -- -Dwarnings
          cargo test --features "$FEATURES"
  # A provider build that names no AEAD backend must fail with the crate's own message. `stream`
  # with no backend at all must lint clean, which no build row covers.
  backend-guard:
    name: provider without a backend is refused
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --features stream -- -Dwarnings
      - run: |
          if output=$(cargo check --features aws-kms-encryption 2>&1); then
            echo "cargo check --features aws-kms-encryption built without a backend"
            exit 1
          fi
          grep -F 'kms-aead needs a crypto backend for its KMS providers' <<< "$output" || { echo "$output"; exit 1; }
  # The docs.rs feature set with rustdoc warnings denied: docs.rs itself publishes a broken
  # intra-doc link or a missing doc without complaint. The minimal sets catch a link to an item
  # that a feature gates, which crates re-exporting kms-aead items show as a dead link.
  docs:
    name: cargo doc
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps --features "ring,aws-lc,rustcrypto,deterministic,legacy-formats,postgres,sqlx,gcp-kms-encryption,aws-kms-encryption,azure-kms-encryption,hashicorp-vault-transit-kms-encryption,opentelemetry,stream"
      - name: cargo doc with minimal feature sets
        run: |
          cargo doc --no-deps
          cargo doc --no-deps --features ring
      # The keyring's docs.rs feature set, and its builds without `admin`, whose docs must not link
      # to the administrative items.
      - name: cargo doc of the keyring
        run: |
          cargo doc --no-deps -p kms-aead-keyring --features "ring,admin,deterministic,firestore-tls-roots,postgres,sqlx,gcs-tls-roots,s3,bigquery-export,opentelemetry,stream"
          cargo doc --no-deps -p kms-aead-keyring
          cargo doc --no-deps -p kms-aead-keyring --features "ring,deterministic,firestore-tls-roots,postgres,sqlx,gcs-tls-roots,s3"
  # The book's code compiles as doctests only with each crate's docs.rs feature set, which no build
  # row has.
  book:
    name: book
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.4'
      - run: cargo test --doc --features "ring,aws-lc,rustcrypto,deterministic,legacy-formats,postgres,sqlx,gcp-kms-encryption,aws-kms-encryption,azure-kms-encryption,hashicorp-vault-transit-kms-encryption,opentelemetry,stream"
      - run: cargo test --doc -p kms-aead-keyring --features "ring,admin,deterministic,firestore-tls-roots,postgres,sqlx,gcs-tls-roots,s3,bigquery-export,opentelemetry,stream"
      - run: cd docs && mdbook build
      # The browser verifier of docs/src/signing.md against the book's vectors, on WebCrypto.
      - run: node tests/webcrypto_vectors.mjs
  # `rust-version` in the workspace's Cargo.toml: each crate's docs.rs feature set builds on it, on
  # dependencies resolved for it.
  msrv:
    name: rust-version
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99
      - run: cargo +1.99 check --lib --features "ring,aws-lc,rustcrypto,deterministic,legacy-formats,postgres,sqlx,gcp-kms-encryption,aws-kms-encryption,azure-kms-encryption,hashicorp-vault-transit-kms-encryption,opentelemetry,stream"
      - run: cargo +1.99 check -p kms-aead-keyring --lib --features "ring,admin,deterministic,firestore-tls-roots,postgres,sqlx,gcs-tls-roots,s3,bigquery-export,opentelemetry,stream"
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
  vault-live:
    name: vault-live
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      vault:
        image: hashicorp/vault:latest
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: --cap-add=IPC_LOCK
    env:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: root
      VAULT_TRANSIT_KEY: orders
      VAULT_TRANSIT_SIGNING_KEY_ED25519: signing-ed25519
      VAULT_TRANSIT_SIGNING_KEY_P256: signing-p256
      VAULT_TRANSIT_KEY_RSA: orders-rsa
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          for attempt in $(seq 1 30); do
            curl -sf "$VAULT_ADDR/v1/sys/health" > /dev/null && break
            sleep 1
          done
          curl -sf -H "X-Vault-Token: $VAULT_TOKEN" -X POST -d '{"type":"transit"}' "$VAULT_ADDR/v1/sys/mounts/transit"
          curl -sf -H "X-Vault-Token: $VAULT_TOKEN" -X POST "$VAULT_ADDR/v1/transit/keys/$VAULT_TRANSIT_KEY"
          curl -sf -H "X-Vault-Token: $VAULT_TOKEN" -X POST -d '{"type":"ed25519"}' "$VAULT_ADDR/v1/transit/keys/$VAULT_TRANSIT_SIGNING_KEY_ED25519"
          curl -sf -H "X-Vault-Token: $VAULT_TOKEN" -X POST -d '{"type":"ecdsa-p256"}' "$VAULT_ADDR/v1/transit/keys/$VAULT_TRANSIT_SIGNING_KEY_P256"
          curl -sf -H "X-Vault-Token: $VAULT_TOKEN" -X POST -d '{"type":"rsa-3072"}' "$VAULT_ADDR/v1/transit/keys/$VAULT_TRANSIT_KEY_RSA"
      - run: cargo test --features hashicorp-vault-transit-kms-encryption,aws-lc --lib -- --ignored hc_vault_transit
  # The keyring stores, one job each. Each job runs the crate's suite with its store's ignored
  # tests included, so that the same two steps serve every store.
  #
  # Firestore runs on the emulator, so that the job needs no credentials. The emulator image's
  # entry point is gcloud, which a service container cannot be given arguments for.
  keyring-firestore:
    name: keyring-firestore
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      FEATURES: ring,admin,deterministic,firestore-tls-roots
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8687
      PROJECT_ID: kms-aead-emulator
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: |
          docker run -d -p 8687:8687 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8687
          for attempt in $(seq 1 60); do
            curl -sf "http://$FIRESTORE_EMULATOR_HOST" > /dev/null && break
            sleep 1
          done
          curl -sf "http://$FIRESTORE_EMULATOR_HOST" > /dev/null
      # `ci-firestore-live` compiles the live test, which runs by hand against Firestore.
      - run: cargo clippy -p kms-aead-keyring --all-targets --features "$FEATURES,ci-firestore-live" -- -Dwarnings
      - run: cargo test -p kms-aead-keyring --features "$FEATURES" -- --include-ignored
      - run: cargo run -p kms-aead-keyring --example sweep_firestore --features "$FEATURES" -- 50
      # The WebPKI build of the store, for an application without native TLS.
      - name: Keep native TLS out of firestore-tls-webpki
        run: |
          if cargo tree -p kms-aead-keyring -e normal --features ring,admin,firestore-tls-webpki --prefix none -f '{p}' | grep -E '^(native-tls|openssl|openssl-sys) v'; then
            echo "firestore-tls-webpki pulls in native TLS"
            exit 1
          fi
      - run: cargo clippy -p kms-aead-keyring --all-targets --features ring,admin,firestore-tls-webpki -- -Dwarnings
      - run: cargo test -p kms-aead-keyring --features ring,admin,firestore-tls-webpki -- --include-ignored
  keyring-postgres:
    name: keyring-postgres
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      FEATURES: ring,admin,deterministic,postgres,sqlx
      KMS_AEAD_KEYRING_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p kms-aead-keyring --all-targets --features "$FEATURES" -- -Dwarnings
      - run: cargo test -p kms-aead-keyring --features "$FEATURES" -- --include-ignored
      - run: cargo run -p kms-aead-keyring --example sweep_postgres --features "$FEATURES" -- 50
  # GCS runs against a real bucket, on master only: the workload identity binding admits this
  # repository's master branch, and the bucket's lifecycle rule deletes each run's objects after a
  # day.
  keyring-gcs:
    name: keyring-gcs
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FEATURES: ring,admin,gcs-tls-roots
      GCP_PROJECT: latestbit
      GCP_PROJECT_ID: 288860578009
      KEYRING_GCS_BUCKET: latestbit-kms-aead-rs-ci
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/${{ env.GCP_PROJECT_ID }}/locations/global/workloadIdentityPools/lb-github-identity-pool/providers/lb-github-identity-pool-provider'
          service_account: 'lb-github-service-account@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com'
          create_credentials_file: true
          access_token_lifetime: '240s'
      - run: cargo clippy -p kms-aead-keyring --all-targets --features "$FEATURES" -- -Dwarnings
      - run: cargo test -p kms-aead-keyring --features "$FEATURES" -- --include-ignored
  # S3 runs on MinIO, so that the job needs no credentials, in a bucket with versioning, which the
  # delete's noncurrent versions and markers need. MinIO publishes no image any more, and
  # its last one writes an object on an update whose object does not exist, which breaks the
  # compare-and-swap, so the job runs pgsty's build of a later release. Its default command is not
  # `server`, which a service container cannot be given.
  keyring-s3:
    name: keyring-s3
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      FEATURES: ring,admin,s3
      KEYRING_S3_ENDPOINT: http://127.0.0.1:9000
      KEYRING_S3_BUCKET: kms-aead-keyrings-ci
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: |
          docker run -d -p 9000:9000 -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            pgsty/silo:RELEASE.2026-10-18T00-00-00Z server /data
          for attempt in $(seq 1 60); do
            curl -sf "$KEYRING_S3_ENDPOINT/minio/health/ready" && break
            sleep 1
          done
          curl -sf --aws-sigv4 "aws:amz:us-east-1:s3" --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" \
            -X PUT "$KEYRING_S3_ENDPOINT/$KEYRING_S3_BUCKET"
          curl -sf --aws-sigv4 "aws:amz:us-east-1:s3" --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" \
            -X PUT "$KEYRING_S3_ENDPOINT/$KEYRING_S3_BUCKET?versioning" \
            -H "Content-Type: application/xml" \
            -d '<VersioningConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><Status>Enabled</Status></VersioningConfiguration>'
      - run: cargo clippy -p kms-aead-keyring --all-targets --features "$FEATURES" -- -Dwarnings
      - run: cargo test -p kms-aead-keyring --features "$FEATURES" -- --include-ignored
  # The BigQuery keyset export runs against Cloud KMS and BigQuery in the same project, on master
  # only, as keyring-gcs does. The keyring lives in the memory store, the test's queries read
  # parameters. The `sweep_bigquery` example is compiled by clippy and not run, because it creates
  # a dataset of its own.
  keyring-bigquery:
    name: keyring-bigquery
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FEATURES: ring,deterministic,ci-bigquery
      GCP_PROJECT: latestbit
      GCP_PROJECT_ID: 288860578009
      PROJECT_ID: latestbit
      PROJECT_LOCATION: europe-north1
      KMS_KEY_RING: test-key-ring
      KMS_KEY: test-key
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/${{ env.GCP_PROJECT_ID }}/locations/global/workloadIdentityPools/lb-github-identity-pool/providers/lb-github-identity-pool-provider'
          service_account: 'lb-github-service-account@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com'
          create_credentials_file: true
          access_token_lifetime: '240s'
      - run: cargo clippy -p kms-aead-keyring --all-targets --features "$FEATURES" -- -Dwarnings
      - run: cargo test -p kms-aead-keyring --features "$FEATURES" -- --include-ignored
  # The keyring without a store, one row per AEAD backend alone so that one backend never hides a
  # missing feature gate in another, plus the optional encodings. The unit tests create keyrings,
  # so these rows build `admin`. The last row is an application's build: every store and encoding
  # without `admin`, so that the data plane compiles and lints clean without the administrative
  # API, and the tests and doctests that need no keyring run against it.
  keyring-core:
    name: keyring ${{ matrix.features }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ring,admin,stream
          - aws-lc,admin
          - rustcrypto,admin
          - ring,admin,deterministic,opentelemetry
          - ring,deterministic,firestore-tls-roots,postgres,sqlx,gcs-tls-roots,s3,opentelemetry
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run checks
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          cargo clippy -p kms-aead-keyring --all-targets --features "$FEATURES" -- -Dwarnings
          cargo test -p kms-aead-keyring --features "$FEATURES"
      # The `tink_export` example needs the GCP and AWS providers, which `ci-tink` turns on, and
      # builds on no other row. It is linted on the aws-lc row, where the providers' TLS already
      # brings aws-lc-rs.
      - name: Lint the tink_export example
        if: matrix.features == 'aws-lc,admin'
        run: cargo clippy -p kms-aead-keyring --example tink_export --features "$FEATURES,ci-tink" -- -Dwarnings
        env:
          FEATURES: ${{ matrix.features }}
  # The keyring's docs.rs feature set, every store at once. The tests that need a store's service
  # stay ignored here; the store jobs above run them. The store clients belong to the keyring, so
  # kms-aead's own tree, with its docs.rs feature set, must not contain them. gcloud-sdk and prost
  # are there legitimately, for the GCP provider.
  keyring-all:
    name: keyring docs.rs feature set
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      FEATURES: ring,admin,deterministic,firestore-tls-roots,postgres,sqlx,gcs-tls-roots,s3,bigquery-export,opentelemetry,stream
      KMS_AEAD_FEATURES: ring,aws-lc,rustcrypto,deterministic,legacy-formats,postgres,sqlx,gcp-kms-encryption,aws-kms-encryption,azure-kms-encryption,hashicorp-vault-transit-kms-encryption,opentelemetry,stream
      ABSENT: firestore sqlx tokio-postgres aws-sdk-s3
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Keep the store clients out of kms-aead
        run: |
          for crate in $ABSENT; do
            if cargo tree -p kms-aead -e normal --features "$KMS_AEAD_FEATURES" --prefix none -f '{p}' | grep -q "^$crate v"; then
              echo "$crate is in kms-aead's dependency tree"
              exit 1
            fi
          done
      - run: cargo clippy -p kms-aead-keyring --all-targets --features "$FEATURES" -- -Dwarnings
      - run: cargo test -p kms-aead-keyring --features "$FEATURES"
  # The PostgreSQL integrations of `Encrypted` through tokio-postgres and sqlx.
  postgres-live:
    name: postgres-live
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --features ring,postgres,sqlx --test postgres_fields -- --ignored
  # Streamed values against pyca/cryptography's Cobblestone-256, an implementation of the same
  # C2SP format that shares no code with kms-aead: it decrypts the three forms kms-aead writes,
  # and kms-aead decrypts what it writes. `cryptography.cobblestone` first shipped in 50.0.0.
  cobblestone-interop:
    name: cobblestone-interop
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: pip install cryptography==50.0.2
      - run: |
          cargo run --example cobblestone_interop --features stream,ring -- encrypt > kms-aead.jsonl
          python -I tests/cobblestone_interop.py decrypt < kms-aead.jsonl
          python -I tests/cobblestone_interop.py encrypt > pyca.jsonl
          cargo run --example cobblestone_interop --features stream,ring -- decrypt < pyca.jsonl
  # The Azure provider against the Lowkey Vault Key Vault emulator, which needs no Azure account.
  azure-emulator:
    name: azure-emulator
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      lowkey-vault:
        image: nagyesta/lowkey-vault:7.3.127
        ports:
          - 8443:8443
    env:
      AZURE_KEY_VAULT_EMULATOR_URL: https://localhost:8443
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          for attempt in $(seq 1 60); do
            curl -skf "$AZURE_KEY_VAULT_EMULATOR_URL/ping" > /dev/null && break
            sleep 1
          done
      - run: cargo test --features azure-kms-encryption,aws-lc --test azure_kms_emulator -- --ignored
