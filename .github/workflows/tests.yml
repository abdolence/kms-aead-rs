name: tests & formatting
on:
  push:
  pull_request:
    types: [opened]
jobs:
  # One row per Vault Transit TLS root store and crypto provider pair, and one per TLS stack
  # the Azure provider builds with. gcloud-sdk's TLS features select reqwest's TLS stack too:
  # `gcp-kms-encryption` turns on native-tls and `gcloud-sdk/tls-webpki-roots` turns on rustls
  # with aws-lc-rs, so each Azure row picks the GCP features that leave the Azure choice in
  # effect.
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: no-vault
            features: gcp-kms-encryption,aws-kms-encryption,serde,ring
          - name: vault-roots-aws-lc-rs
            features: gcp-kms-encryption,aws-kms-encryption,serde,ring,hashicorp-vault-transit-kms-encryption-tls-roots,hashicorp-vault-transit-kms-encryption-tls-aws-lc-rs
          - name: vault-webpki-aws-lc-rs
            features: gcp-kms-encryption,aws-kms-encryption,serde,ring,hashicorp-vault-transit-kms-encryption-tls-webpki,hashicorp-vault-transit-kms-encryption-tls-aws-lc-rs
          - name: vault-roots-ring
            features: gcp-kms-encryption,aws-kms-encryption,serde,ring,hashicorp-vault-transit-kms-encryption-tls-roots,hashicorp-vault-transit-kms-encryption-tls-ring
          - name: vault-webpki-ring
            features: gcp-kms-encryption,aws-kms-encryption,serde,ring,hashicorp-vault-transit-kms-encryption-tls-webpki,hashicorp-vault-transit-kms-encryption-tls-ring
          - name: azure-native-tls
            features: gcp-kms-encryption,aws-kms-encryption,serde,ring,azure-kms-encryption-native-tls
          - name: azure-rustls-aws-lc-rs
            features: gcp-kms-encryption-base,gcloud-sdk/tls-webpki-roots,aws-kms-encryption,serde,ring,azure-kms-encryption-tls-aws-lc-rs
          - name: azure-rustls-no-provider
            features: aws-kms-encryption,serde,ring,azure-kms-encryption-tls-no-provider
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: rustfmt, clippy
      - name: Run checks
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          cargo fmt -- --check
          if cargo tree -e normal --features "$FEATURES" -d --depth 0 | grep -q '^reqwest '; then
            echo "Two reqwest versions: the Azure TLS features would configure the one azure_core does not use"
            exit 1
          fi
          cargo clippy --all-targets --features "$FEATURES" -- -Dwarnings
          cargo test --features "$FEATURES"
  vault-live:
    name: vault-live
    runs-on: ubuntu-latest
    services:
      vault:
        image: hashicorp/vault:latest
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: --cap-add=IPC_LOCK
    env:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: root
      VAULT_TRANSIT_KEY: orders
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
      - run: |
          for attempt in $(seq 1 30); do
            curl -sf "$VAULT_ADDR/v1/sys/health" > /dev/null && break
            sleep 1
          done
          curl -sf -H "X-Vault-Token: $VAULT_TOKEN" -X POST -d '{"type":"transit"}' "$VAULT_ADDR/v1/sys/mounts/transit"
          curl -sf -H "X-Vault-Token: $VAULT_TOKEN" -X POST "$VAULT_ADDR/v1/transit/keys/$VAULT_TRANSIT_KEY"
      - run: cargo test --features hashicorp-vault-transit-kms-encryption,ring --lib -- --ignored hc_vault_transit
