[[test]]
name = "metrics"
path = "tests/metrics.rs"
required-features = ["opentelemetry", "ring"]

[[test]]
name = "postgres_fields"
path = "tests/postgres_fields.rs"
required-features = ["postgres", "sqlx", "ring"]

[[test]]
name = "azure_kms_emulator"
path = "tests/azure_kms_emulator.rs"
required-features = ["azure-kms-encryption-base"]

[[test]]
name = "azure_kms_responses"
path = "tests/azure_kms_responses.rs"
required-features = ["azure-kms-encryption-base"]

[[test]]
name = "azure_kms_signing_responses"
path = "tests/azure_kms_signing_responses.rs"
required-features = ["azure-kms-encryption-base"]

[[test]]
name = "public_key_fingerprint"
path = "tests/public_key_fingerprint.rs"
required-features = ["aws-lc"]

[[test]]
name = "aws_spawned_call"
path = "tests/aws_spawned_call.rs"
required-features = ["aws-kms-encryption", "aws-lc"]

[[example]]
name = "tink_interop"
path = "examples/tink_interop.rs"
required-features = ["gcp-kms-encryption", "aws-kms-encryption", "aws-lc"]

[[example]]
name = "cobblestone_interop"
path = "examples/cobblestone_interop.rs"
required-features = ["stream", "ring"]

[[example]]
name = "only_aead"
path = "examples/only_aead.rs"
required-features = ["ring"]

[[example]]
name = "tracing"
path = "examples/tracing.rs"
required-features = ["ring"]

[[example]]
name = "stream_range_read"
path = "examples/stream_range_read.rs"
required-features = ["stream", "ring"]

[[example]]
name = "stream_body"
path = "examples/stream_body.rs"
required-features = ["stream", "ring"]

[[example]]
name = "axum_encrypted_stream"
path = "examples/axum_encrypted_stream.rs"
required-features = ["stream", "ring"]

[[example]]
name = "encrypted_json"
path = "examples/encrypted_json.rs"
required-features = ["ring"]

[[example]]
name = "signing"
path = "examples/signing.rs"
required-features = ["ring"]

[[example]]
name = "asymmetric_kek"
path = "examples/asymmetric_kek.rs"
required-features = ["aws-lc"]
