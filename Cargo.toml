[package]
name = "kms-aead"
version = "0.30.0"
authors = ["Abdulla Abdurakhmanov <me@abdolence.dev>"]
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "Envelope encryption with Google Cloud KMS, AWS KMS, Azure Key Vault, HashiCorp Vault Transit or a local KEK, in Tink's formats: typed fields, deterministic AEAD and beacons, on ring, aws-lc-rs or RustCrypto"
homepage = "https://kms-aead-rust.abdolence.dev"
repository = "https://github.com/abdolence/kms-aead-rs"
documentation = "https://docs.rs/kms-aead"
categories = ["cryptography","api-bindings"]
keywords = ["kms", "google", "aws", "azure", "vault"]
readme = "README.md"
include = ["Cargo.toml", "src/**/*.rs", "README.md", "LICENSE", "SECURITY.md", "docs/src/**/*.md"]

[workspace]
members = ["kms-aead-keyring"]

[workspace.package]
rust-version = "1.99"

# The versions of the crates both members depend on, so that the two never resolve to different
# releases. A member adds the features it needs on top.
[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
futures-core = "0.3"
gcloud-sdk = { version = "0.33", default-features = false }
opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics", "spec_unstable_metrics_views", "testing"] }
proptest = "1.4"
rsb_derive = "0.5"
secret-vault-value = { version = "1.0.4", features = ["base64"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
# The smallest sqlx crates that carry its encoding traits and its Postgres types, so that a
# `sqlx` feature brings in no runtime and no TLS stack.
sqlx-core = { version = "0.9", default-features = false }
sqlx-postgres = { version = "0.9", default-features = false }
subtle = "2.6.1"
tokio = { version = "1", default-features = false }
tracing = "0.1"
tracing-subscriber = "0.3"

[badges]
maintenance = { status = "actively-developed" }

[workspace.lints.clippy]
mod_module_files = "deny"
unwrap_used = "deny"

[lints]
workspace = true

[lib]
name = "kms_aead"
path = "src/lib.rs"
bench = false

[dependencies]
tracing = { workspace = true }
secret-vault-value = { workspace = true, features = ["serde"] }
rsb_derive = { workspace = true }
hex = "0.4"
# The instruments of the `opentelemetry` feature: the API only, never the SDK.
opentelemetry = { workspace = true, optional = true }
ring = { version = "0.17", features = ["default", "std"], optional = true }
# The oldest release that exports every algorithm the AwsLc backend offers, so that an
# application can pin an older aws-lc-rs to stay on an older FIPS module.
aws-lc-rs = { version = "1.16.3", default-features = false, optional = true }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes"], optional = true }
aes-gcm-siv = { version = "0.12.1", default-features = false, features = ["aes"], optional = true }
chacha20poly1305 = { version = "0.11.0", default-features = false, optional = true }
# `ChaCha20Rng` seeded from the system generator, the infallible generator RSA key generation takes.
chacha20 = { version = "0.10", default-features = false, features = ["rng"], optional = true }
aes-siv = { version = "0.8.0", default-features = false, optional = true }
# Depended on only to turn on their `zeroize` features. The AES and CMAC key schedules inside
# aes-gcm-siv and aes-siv are not zeroized otherwise: aes-siv's own `zeroize` does not reach them.
aes = { version = "0.9", default-features = false, optional = true }
cmac = { version = "0.8", default-features = false, optional = true }
# Depended on only to turn on their `zeroize` features. ChaCha20-Poly1305's one-time Poly1305 key
# and the POLYVAL key of AES-256-GCM-SIV are not zeroized otherwise.
poly1305 = { version = "0.9", default-features = false, optional = true }
polyval = { version = "0.7", default-features = false, optional = true }
# HMAC-SHA256 of the beacons on RustCrypto.
hmac = { version = "0.13", optional = true }
# The RustCrypto backend's hashes, and in every build the SHA-256 of a key's RFC 7638 thumbprint,
# which a public key's id is derived from on no backend.
sha2 = { workspace = true }
# The major version `aead` 0.6 depends on, so that one copy is in the tree.
getrandom = { version = "0.4", optional = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
gcloud-sdk = { workspace = true, optional = true }
# `credentials-login` is what lets the default credentials chain use the session of `aws login`.
aws-config = { version = "1", optional = true, features = ["behavior-version-latest", "credentials-login"] }
aws-sdk-kms = { version = "1", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
subtle = { workspace = true }
# Tink's key and keyset messages. The version gcloud-sdk depends on, so that one copy is in the tree.
prost = "0.14"
# The framing of keys and signatures: SubjectPublicKeyInfo, PKCS#8, the ECDSA `ECDSA-Sig-Value`
# and PEM, so that no ASN.1 or PEM parser is the crate's own. `base64ct` is pem-rfc7468's, for the
# base64url of JSON Web Keys.
der = { version = "0.8", features = ["alloc", "derive", "oid"] }
spki = { version = "0.8", features = ["alloc"] }
pkcs8 = { version = "0.11", default-features = false }
sec1 = { version = "0.8", default-features = false, features = ["der"] }
pem-rfc7468 = { version = "1", features = ["alloc"] }
base64ct = { version = "1", features = ["alloc"] }
# The signatures of the RustCrypto backend, with their key types zeroised on drop.
p256 = { version = "0.14", default-features = false, features = ["ecdsa"], optional = true }
ed25519-dalek = { version = "3", optional = true }
# RSA-OAEP of the asymmetric KEKs on the RustCrypto backend. A release candidate, required in the
# caret form so that 0.10.0 and the 0.10 releases after it resolve with no bump of kms-aead.
rsa = { version = "^0.10.0-rc.19", default-features = false, features = ["encoding"], optional = true }
# The checksums of Cloud KMS requests and responses.
crc32c = { version = "0.6", optional = true }
# `sync` shares one unwrap among the concurrent misses of the DEK cache on any executor, and holds
# the store-less DEK renewal to one caller at a time.
tokio = { workspace = true, features = ["sync"] }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"], optional = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1"], optional = true }
http-body-util = { version = "0.1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
webpki-roots = { version = "1", optional = true }
percent-encoding = { version = "2", optional = true }
go-duration = { version = "0.2", optional = true }
serde_json = { workspace = true }
azure_core = { version = "1.1", optional = true, default-features = false, features = ["reqwest", "tokio"] }
azure_security_keyvault_keys = { version = "1.0.1", optional = true, default-features = false }
# Selects the TLS features of the reqwest client azure_core builds, so it must stay on the reqwest
# version azure_core depends on.
reqwest = { version = "0.13.2", optional = true, default-features = false }
postgres-types = { version = "0.2", optional = true }
# The buffer `ToSql::to_sql` writes into, which postgres-types does not re-export.
bytes = { workspace = true, optional = true }
# `Stream`, the trait of `EncryptingStream` and `DecryptingStream`.
futures-core = { workspace = true, optional = true }
sqlx-core = { workspace = true, optional = true }
sqlx-postgres = { workspace = true, optional = true }

[dev-dependencies]
# The Azure SDK's credential and HTTP client traits, which the Azure tests implement.
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full"] }
futures = { workspace = true }
proptest = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
criterion = { version = "0.8", features = ["async", "async_futures", "cargo_bench_support", "html_reports", "async_tokio"] }
cargo-husky = { version = "1.5", default-features = false, features = ["run-for-all", "prepush-hook", "run-cargo-fmt"] }
rustls = "0.23"
azure_identity = { version = "1.0", default-features = false }
tokio-postgres = "0.7"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }
# The meter provider of the metrics chapter's code.
opentelemetry_sdk = { workspace = true }
# The zlib-compressed cipher texts and the SHA-512 message digests of the Wycheproof vectors of
# streamed values.
miniz_oxide = "0.8"
# The `axum_encrypted_stream` example: an axum server that streams items with axum-streams and a
# reqwest client that decodes them with reqwest-streams. No TLS stack, as the example talks to a
# loopback port.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
axum-streams = { version = "0.30", features = ["json"] }
reqwest-streams = { version = "0.20", features = ["json"] }
reqwest = { version = "0.13.2", default-features = false, features = ["stream"] }

[features]
default = []
# `ToSql` and `FromSql` of postgres-types for `Encrypted`, as `BYTEA`.
postgres = ["dep:postgres-types", "dep:bytes"]
# sqlx's `Type`, `Encode`, `Decode` and `PgHasArrayType` for `Encrypted` on Postgres, as `BYTEA`.
sqlx = ["dep:sqlx-core", "dep:sqlx-postgres"]
# AEAD backends: any number of them in one build.
ring = ["dep:ring"]
# `aws-lc-rs` is the implicit feature of the optional dependency, the one gate of the AwsLc
# backend for both features below. Enabled alone it fails aws-lc-rs's build: "one of the following
# features must be specified: `aws-lc-sys`, `non-fips`, or `fips`". Enable `aws-lc` or
# `aws-lc-fips` instead.
aws-lc = ["aws-lc-rs", "aws-lc-rs/aws-lc-sys"]
# The AwsLc backend on the FIPS module, without the non-FIPS aws-lc-sys. Moves every aws-lc-rs
# user in the build, the rustls aws-lc-rs provider included, to the FIPS module. Needs CMake and
# Go to build. With `aws-lc` as well, both C libraries are built and aws-lc-rs runs on the FIPS one.
aws-lc-fips = ["aws-lc-rs", "aws-lc-rs/fips"]
rustcrypto = [
    "dep:aes-gcm",
    "dep:aes-gcm-siv",
    "dep:chacha20poly1305",
    "dep:chacha20",
    "dep:getrandom",
    "aes-gcm/zeroize",
    "aes-gcm-siv/zeroize",
    "chacha20poly1305/zeroize",
    "dep:aes",
    "aes/zeroize",
    "dep:poly1305",
    "poly1305/zeroize",
    "dep:polyval",
    "polyval/zeroize",
    "dep:hmac",
    "hmac/zeroize",
    "sha2/zeroize",
    "dep:p256",
    "dep:ed25519-dalek",
    "dep:rsa",
    # `SysRng`, the `rand_core` generator `rsa` draws the OAEP seeds and the blinding from.
    "getrandom/sys_rng",
]
# `aes-siv/alloc` carries the `siv::Aes256Siv` calls that take the associated data as a list.
deterministic = [
    "dep:aes-siv",
    "aes-siv/alloc",
    "aes-siv/zeroize",
    "dep:aes",
    "aes/zeroize",
    "dep:cmac",
    "cmac/zeroize",
]
# Deprecated: reads the layouts written by 0.29 and earlier. Reading them will be removed in a
# later breaking release.
legacy-formats = []
# Streamed values of any length, C2SP chunked encryption: the `stream` module, its sans-IO encryptor
# and decryptor, their tokio adapters, which need `io-util`, and their adapters on `Stream`s of
# `Bytes`.
stream = ["tokio/io-util", "dep:bytes", "dep:futures-core"]
# OpenTelemetry metrics of the envelope's calls and the KMS requests, which kms-aead-keyring
# records its calls into too, on the API crate: the application installs the SDK and an exporter.
opentelemetry = ["dep:opentelemetry"]
gcp = ["gcloud-sdk"]
# The GCP KMS provider without a TLS root store or crypto provider. It needs a gcloud-sdk root
# store feature from the application to build.
gcp-kms-encryption-base = ["gcp", "gcloud-sdk/google-cloud-kms-v1", "gcloud-sdk/google-longrunning", "dep:crc32c"]
gcp-kms-encryption = ["gcp-kms-encryption-base", "gcloud-sdk/tls-roots", "gcloud-sdk/auth-default-crypto"]
gcp-kms-encryption-webpki = ["gcp-kms-encryption-base", "gcloud-sdk/tls-webpki-roots", "gcloud-sdk/auth-default-crypto"]
aws = ["dep:aws-config"]
aws-kms-encryption = ["aws", "dep:aws-sdk-kms"]
azure-kms-encryption-base = ["dep:azure_core", "dep:azure_security_keyvault_keys", "dep:reqwest"]
# TLS variants - user can choose one
azure-kms-encryption-tls-aws-lc-rs = ["azure-kms-encryption-base", "azure_core/reqwest_rustls"]
azure-kms-encryption-tls-no-provider = ["azure-kms-encryption-base", "reqwest/rustls-no-provider"]
azure-kms-encryption-native-tls = ["azure-kms-encryption-base", "reqwest/native-tls"]
azure-kms-encryption = ["azure-kms-encryption-tls-aws-lc-rs"]
ci-gcp = ["gcp-kms-encryption"] # Live tests against a GCP KMS key
ci-aws = ["aws-kms-encryption"] # Live tests against an AWS KMS key
hashicorp-vault-transit-kms-encryption-base = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:http-body-util",
    "dep:rustls",
    "dep:percent-encoding",
    "dep:go-duration",
    "tokio/time",
]
# TLS root store variants - user can choose one
hashicorp-vault-transit-kms-encryption-tls-roots = ["hashicorp-vault-transit-kms-encryption-base", "dep:rustls-native-certs"]
hashicorp-vault-transit-kms-encryption-tls-webpki = ["hashicorp-vault-transit-kms-encryption-base", "dep:webpki-roots"]
# TLS crypto provider variants - user can choose one
hashicorp-vault-transit-kms-encryption-tls-aws-lc-rs = ["hashicorp-vault-transit-kms-encryption-base", "rustls/aws_lc_rs"]
hashicorp-vault-transit-kms-encryption-tls-ring = ["hashicorp-vault-transit-kms-encryption-base", "rustls/ring"]
hashicorp-vault-transit-kms-encryption = ["hashicorp-vault-transit-kms-encryption-tls-roots", "hashicorp-vault-transit-kms-encryption-tls-aws-lc-rs"]

[package.metadata.docs.rs]
all-features = false
features = ["ring", "aws-lc", "rustcrypto", "deterministic", "legacy-formats", "postgres", "sqlx", "gcp-kms-encryption", "aws-kms-encryption", "azure-kms-encryption", "hashicorp-vault-transit-kms-encryption", "opentelemetry", "stream"]

[[example]]
name = "aws_kms"
path = "examples/aws_kms.rs"
required-features = ["aws-kms-encryption", "ring"]

[[example]]
name = "gcp_kms"
path = "examples/gcp_kms.rs"
required-features = ["gcp-kms-encryption", "ring"]

[[example]]
name = "hc_vault_transit_kms"
path = "examples/hc_vault_transit_kms.rs"
required-features = ["hashicorp-vault-transit-kms-encryption-base", "ring"]

[[example]]
name = "azure_kms"
path = "examples/azure_kms.rs"
